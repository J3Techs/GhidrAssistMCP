 *
 */
// Builds a Ghidra Extension for a given Ghidra installation.
//
// An absolute path to the Ghidra installation directory must be supplied either by setting the 
// GHIDRA_INSTALL_DIR environment variable or Gradle project property:
//
//     > export GHIDRA_INSTALL_DIR=<Absolute path to Ghidra> 
//     > ./gradlew
//
//         or
//
//     > ./gradlew -PGHIDRA_INSTALL_DIR=<Absolute path to Ghidra>
//
// Gradle should be invoked from the directory of the project to build.  Please see the
// application.gradle.version property in <GHIDRA_INSTALL_DIR>/Ghidra/application.properties
// for the correction version of Gradle to use for the Ghidra installation you specify.

//----------------------START "DO NOT MODIFY" SECTION------------------------------
if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_25)) {
	throw new GradleException(
		"GhidrAssistMCP builds require Java 25 or newer; found ${JavaVersion.current()}")
}

def ghidraInstallDir

if (System.env.GHIDRA_INSTALL_DIR) {
	ghidraInstallDir = System.env.GHIDRA_INSTALL_DIR
}
else if (project.hasProperty("GHIDRA_INSTALL_DIR")) {
	ghidraInstallDir = project.getProperty("GHIDRA_INSTALL_DIR")
}
else {
	ghidraInstallDir = "<REPLACE>"
}

task distributeExtension {
	group = "Ghidra"

	apply from: new File(ghidraInstallDir).getCanonicalPath() + "/support/buildExtension.gradle"
	dependsOn ':buildExtension'
}
//----------------------END "DO NOT MODIFY" SECTION-------------------------------

repositories {
	mavenCentral()
}

dependencies {
	// MCP SDK core dependency
	implementation platform('io.modelcontextprotocol.sdk:mcp-bom:2.0.1')
	implementation 'io.modelcontextprotocol.sdk:mcp-core'
	implementation 'io.modelcontextprotocol.sdk:mcp-json-jackson2'
	
	// Jetty embedded server for servlet container
	implementation 'org.eclipse.jetty:jetty-server:12.1.13'
	implementation 'org.eclipse.jetty.ee10:jetty-ee10-servlet:12.1.13'
	
	// Jackson for JSON processing (required by MCP)
	implementation platform('com.fasterxml.jackson:jackson-bom:2.21.1')
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'com.fasterxml.jackson.core:jackson-core'
	implementation 'com.fasterxml.jackson.core:jackson-annotations'

	testImplementation 'org.junit.jupiter:junit-jupiter:6.1.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.0'
}

// Ghidra's helper stages dependencies into lib/ and also adds lib/*.jar back to
// the classpath. After an upgrade that retains obsolete SDK/Jackson jars. Resolve
// Maven dependencies once and package a synchronized, generated directory instead.
def legacyLibraryRoot = file('lib').canonicalFile.toPath()
configurations.api.dependencies.removeAll { dependency ->
    dependency instanceof org.gradle.api.artifacts.FileCollectionDependency &&
        dependency.files.files.any { it.canonicalFile.toPath().startsWith(legacyLibraryRoot) }
}
tasks.named('copyDependencies') { enabled = false }
def runtimeLibraries = tasks.register('stageRuntimeLibraries', Sync) {
    from(configurations.runtimeClasspath.filter { library ->
        !library.canonicalFile.toPath().startsWith(file(ghidraInstallDir).canonicalFile.toPath()) &&
        !library.canonicalFile.toPath().startsWith(legacyLibraryRoot)
    })
    into layout.buildDirectory.dir('dependency-libs')
}
tasks.named('buildExtension') {
    dependsOn runtimeLibraries
    exclude 'lib/**'
    from(runtimeLibraries) { into "${project.name}/lib" }
}

tasks.named('test') {
	useJUnitPlatform()
    systemProperty 'ghidra.install.dir', ghidraInstallDir
}

tasks.register('writeUpgradeFixtureArgs') {
    dependsOn 'testClasses'
    doLast {
        def destination = layout.buildDirectory.file('upgrade-fixture-java.args').get().asFile
        def quoted = { value -> '"' + value.toString().replace('\\', '/').replace('"', '\\"') + '"' }
        destination.text = '-Dghidra.install.dir=' + quoted(ghidraInstallDir) + '\n-classpath\n' +
            quoted(sourceSets.test.runtimeClasspath.asPath) + '\nghidrassistmcp.UpgradeFixtureServer\n'
    }
}

def operatingGuide = file('src/main/resources/ghidrassistmcp/operating-guide.md')
def clientGuideCopies = [
    'claude-code-integration/skills/port-functions/references/operating-guide.md',
    'claude-code-integration/skills/deep-function/references/operating-guide.md',
    'grok-integration/references/operating-guide.md'
].collect { file(it) }

tasks.register('syncOperatingGuides') {
    group = 'documentation'
    description = 'Copy the canonical server guide into standalone client packages'
    inputs.file operatingGuide
    outputs.files clientGuideCopies
    doLast { clientGuideCopies.each { target ->
        target.parentFile.mkdirs()
        target.bytes = operatingGuide.bytes
    } }
}
tasks.register('checkOperatingGuides') {
    group = 'verification'
    mustRunAfter 'syncOperatingGuides'
    description = 'Reject drift between the server guide and packaged client copies'
    inputs.file operatingGuide
    inputs.files clientGuideCopies
    doLast { clientGuideCopies.each { target ->
        if (!target.exists() || !Arrays.equals(operatingGuide.bytes, target.bytes)) {
            throw new GradleException("Operating guide drift: ${target}. Run syncOperatingGuides.")
        }
    } }
}
tasks.named('check') { dependsOn 'checkOperatingGuides' }
tasks.named('buildExtension') {
    dependsOn 'checkOperatingGuides'
    exclude '.claude-plugin/**', 'claude-code-integration/**', 'grok-integration/**', '.agents/**', 'validation/**'
}

def generatedBuildInfo = layout.buildDirectory.dir('generated/build-info')
tasks.register('generateBuildInfo') {
    outputs.dir(generatedBuildInfo)
    outputs.upToDateWhen { false }
    doLast {
        def props = new Properties()
        props.setProperty('revision', providers.exec { commandLine 'git', 'rev-parse', 'HEAD' }.standardOutput.asText.get().trim())
        props.setProperty('dirty', (!providers.exec { commandLine 'git', 'status', '--porcelain' }.standardOutput.asText.get().trim().isEmpty()).toString())
        props.setProperty('built_at', java.time.Instant.now().toString())
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        def sourceInputs = (fileTree('src/main').files + [file('build.gradle'), file('extension.properties')]).sort { relativePath(it).replace('\\', '/') }
        sourceInputs.each { input ->
            digest.update(relativePath(input).replace('\\', '/').getBytes('UTF-8'))
            digest.update((byte) 0)
            digest.update(input.bytes)
            digest.update((byte) 0)
        }
        props.setProperty('source_sha256', java.util.HexFormat.of().formatHex(digest.digest()))
        def destination = generatedBuildInfo.get().file('build-info.properties').asFile
        destination.parentFile.mkdirs()
        destination.withOutputStream { props.store(it, 'GhidrAssistMCP build provenance') }
    }
}
sourceSets.main.resources.srcDir(generatedBuildInfo)
tasks.named('processResources') { dependsOn tasks.named('generateBuildInfo') }

// Exclude additional files from the built extension
// Ex: buildExtension.exclude '.idea/**'

/**
 * Convenience tasks for local development:
 * - `./gradlew buildExtension` creates the extension zip in `dist/`
 * - `./gradlew installExtension` unzips that extension into your Ghidra *user* Extensions folder
 *
 * This mirrors the Ghidra UI "Install Extensions" flow, which ultimately extracts into:
 * - Windows: %APPDATA%\ghidra\ghidra_<version>_<release>\Extensions\<ExtensionName>
 * - Linux: ~/.config/ghidra/ghidra_<version>_<release>/Extensions/<ExtensionName>
 * - macOS: ~/Library/ghidra/ghidra_<version>_<release>/Extensions/<ExtensionName>
 *
 * You can override the destination Extensions folder via:
 * - Gradle property: -PGHIDRA_USER_EXTENSIONS_DIR="C:\path\to\... \Extensions"
 * - Env var: GHIDRA_USER_EXTENSIONS_DIR
 */
def extensionName = project.name

def ghidraUserExtensionsDir = {
	def overrideProp = project.findProperty("GHIDRA_USER_EXTENSIONS_DIR")
	if (overrideProp) {
		return file(overrideProp.toString())
	}
	def overrideEnv = System.getenv("GHIDRA_USER_EXTENSIONS_DIR")
	if (overrideEnv) {
		return file(overrideEnv)
	}

	def osName = (System.getProperty("os.name") ?: "").toLowerCase(Locale.ROOT)
	def ghidraUserProfileDirName = "${DISTRO_PREFIX}_${RELEASE_NAME}"

	if (osName.contains("windows")) {
		def appData = System.getenv("APPDATA")
		if (appData) {
			return file("${appData}/ghidra/${ghidraUserProfileDirName}/Extensions")
		}
	}

	if (osName.contains("mac") || osName.contains("darwin")) {
		return file("${System.getProperty('user.home')}/Library/ghidra/${ghidraUserProfileDirName}/Extensions")
	}

	def xdgConfigHome = System.getenv("XDG_CONFIG_HOME")
	def linuxConfigDir = xdgConfigHome ?: "${System.getProperty('user.home')}/.config"
	return file("${linuxConfigDir}/ghidra/${ghidraUserProfileDirName}/Extensions")
}.call()

/**
 * Where to copy the built extension zip for a given Ghidra install.
 *
 * Default:
 *   <GHIDRA_INSTALL_DIR>/Extensions/Ghidra
 *
 * Override via:
 *   - Gradle property: -PGHIDRA_EXTENSIONS_DROP_DIR="D:\path\to\Extensions\Ghidra"
 *   - Env var: GHIDRA_EXTENSIONS_DROP_DIR
 */
def ghidraInstallExtensionsZipDir = {
	def overrideProp = project.findProperty("GHIDRA_EXTENSIONS_DROP_DIR")
	if (overrideProp) {
		return file(overrideProp.toString())
	}
	def overrideEnv = System.getenv("GHIDRA_EXTENSIONS_DROP_DIR")
	if (overrideEnv) {
		return file(overrideEnv)
	}
	return file("${ghidraInstallDir}/Extensions/Ghidra")
}.call()

def buildZipProvider = tasks.named('buildExtension', Zip).flatMap { it.archiveFile }

def extensionZipGlob = "*_${extensionName}.zip"
def installZipDropFileTree = fileTree(ghidraInstallExtensionsZipDir) { include extensionZipGlob }

tasks.register('cleanExtractedExtension', Delete) {
	group = "Ghidra"
	description = "Delete the extracted extension from Ghidra's user Extensions folder"
	delete new File(ghidraUserExtensionsDir, extensionName)
}

tasks.register('cleanCopiedExtensionZips', Delete) {
	group = "Ghidra"
	description = "Delete copied extension zip(s) from the Ghidra install Extensions/Ghidra folder"
	delete installZipDropFileTree
}

tasks.register('copyExtensionZip', Copy) {
	group = "Ghidra"
	description = "Copy the built extension zip into the Ghidra install Extensions/Ghidra folder"

	dependsOn tasks.named('buildExtension'), tasks.named('cleanCopiedExtensionZips')

	from(buildZipProvider)
	into ghidraInstallExtensionsZipDir
}

tasks.register('extractExtension', Copy) {
	group = "Ghidra"
	description = "Extract the built extension into Ghidra's user Extensions folder"

	dependsOn tasks.named('buildExtension'), tasks.named('cleanExtractedExtension')

	from {
		zipTree(buildZipProvider.get().asFile)
	}
	into ghidraUserExtensionsDir
}

tasks.register('installExtension') {
	group = "Ghidra"
	description = "Copy the zip to the Ghidra install and extract into the user Extensions folder"
	dependsOn tasks.named('copyExtensionZip'), tasks.named('extractExtension')
}

tasks.register('uninstallExtension') {
	group = "Ghidra"
	description = "Delete the extracted extension and remove copied extension zip(s)"
	dependsOn tasks.named('cleanExtractedExtension'), tasks.named('cleanCopiedExtensionZips')
}
